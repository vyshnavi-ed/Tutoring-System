<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tutor — Teacher dashboard</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="top">
  <h1>Teacher dashboard</h1>
  <nav><a href="/">← Student view</a></nav>
</header>
<main>
  <div class="tabs">
    <button data-tab="alerts" class="active">Alerts <span id="alert-count"></span></button>
    <button data-tab="students">Students</button>
    <button data-tab="packs">Content packs</button>
    <button data-tab="buddy">Science Buddy</button>
  </div>
  <div id="view"></div>
</main>
<script src="/static/common.js"></script>
<script>
const view = document.getElementById("view");
let packs = [];
const packTitle = id => id === "science_buddy" ? "Science Buddy" : ((packs.find(p => p.id === id) || {}).title || id);

document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => show(b.dataset.tab));

async function show(tab) {
  document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
  packs = await api.get("/api/packs");
  refreshCount();
  ({ alerts, students, packs: packsTab, buddy: buddyTab })[tab]();
}

async function refreshCount() {
  const a = await api.get("/api/teacher/alerts");
  document.getElementById("alert-count").textContent = a.length ? `(${a.length})` : "";
}

// ---------------------------------------------------------------- alerts
async function alerts() {
  const list = await api.get("/api/teacher/alerts");
  if (!list.length) { view.innerHTML = `<div class="panel empty">No open alerts. Students who get stuck will show up here.</div>`; return; }
  view.innerHTML = list.map(a => `
    <div class="panel alert-card ${a.kind}" style="margin-bottom:12px">
      <div class="row">
        <span class="badge ${a.kind === "stuck" ? "warn" : a.kind === "wellbeing" ? "bad" : ""}">${a.kind === "stuck" ? "Stuck" : a.kind === "wellbeing" ? "Wellbeing — please review" : "Answer to review"}</span>
        <b>${esc(a.student_id)}</b><span class="muted small">${esc(packTitle(a.pack_id))} · ${ago(a.ts)}</span>
        <span style="margin-left:auto"></span>
        <button class="link" data-open="${esc(a.student_id)}|${esc(a.pack_id)}">View path</button>
        <button data-resolve="${a.id}">Resolve</button>
      </div>
      <div style="margin-top:8px">${esc(a.message)}</div>
      ${a.kind === "wellbeing" ? `<pre class="resp">${esc(a.details.excerpt || "")}</pre>` : ""}
      ${a.kind === "review" ? `<div class="small muted" style="margin-top:8px">${md(a.details.prompt)}</div>
        <pre class="resp">${esc(a.details.response)}</pre>
        <div class="small muted">Provisional score: ${a.details.provisional_score}</div>` : ""}
    </div>`).join("");
  view.querySelectorAll("[data-resolve]").forEach(b => b.onclick = async () => {
    const note = prompt("Optional note (what you did / the right grade):", "") ?? null;
    if (note === null) return;
    await api.post(`/api/teacher/alerts/${b.dataset.resolve}/resolve`, { note });
    alerts(); refreshCount();
  });
  view.querySelectorAll("[data-open]").forEach(b => b.onclick = () => { const [s, p] = b.dataset.open.split("|"); p === "science_buddy" ? buddyDetail(s) : detail(s, p); });
}

// ---------------------------------------------------------------- students
async function students() {
  const rows = await api.get("/api/teacher/sessions");
  if (!rows.length) { view.innerHTML = `<div class="panel empty">No student sessions yet.</div>`; return; }
  const misc = (await Promise.all(packs.filter(p => p.pedagogy === "inquiry").map(async p =>
    (await api.get(`/api/teacher/misconceptions/${p.id}`)).map(m => ({ ...m, pack: p.title }))))).flat();
  view.innerHTML = (misc.length ? `<div class="panel" style="margin-bottom:16px"><h3 style="margin-top:0">Common misconceptions</h3>
    <table><tr><th>Misconception</th><th>Skill</th><th>Students</th></tr>${misc.map(m => `
      <tr><td><b>${esc(m.label)}</b></td><td class="muted">${esc(m.pack)} · ${esc(m.set_title)}</td>
      <td>${m.students.length} — ${m.students.map(esc).join(", ")}</td></tr>`).join("")}</table></div>` : "") + `<div class="panel"><table>
    <tr><th>Student</th><th>Subject</th><th>Strategy</th><th>Attempts</th><th>Correct</th><th>Alerts</th><th>Last active</th></tr>
    ${rows.map(r => {
      const p = packs.find(x => x.id === r.pack) || {};
      return `<tr class="click" data-s="${esc(r.student)}" data-p="${esc(r.pack)}">
        <td><b>${esc(r.student)}</b></td><td>${esc(p.title || r.pack)}</td>
        <td><span class="badge grey">${STRATEGY_LABEL[p.strategy] || ""}</span></td>
        <td>${r.attempts}</td><td>${r.attempts ? Math.round(100 * r.correct / r.attempts) + "%" : "—"}</td>
        <td>${r.open_alerts ? `<span class="badge warn">${r.open_alerts}</span>` : ""}</td>
        <td class="muted">${ago(r.updated)}</td></tr>`;
    }).join("")}</table></div>`;
  view.querySelectorAll("tr.click").forEach(tr => tr.onclick = () => detail(tr.dataset.s, tr.dataset.p));
}

async function detail(student, packId) {
  const [d, pack] = await Promise.all([
    api.get(`/api/teacher/sessions/${encodeURIComponent(student)}/${packId}`),
    api.get(`/api/packs/${packId}`),
  ]);
  const setTitle = id => (pack.item_sets[id] || {}).title || id;
  window.misLabel = (sid, mid) => {
    for (const it of ((pack.item_sets[sid] || {}).items || []))
      for (const m of (it.misconceptions || [])) if (m.id === mid) return m.label || mid;
    return mid;
  };
  const setLevel = id => (pack.item_sets[id] || {}).level || "";
  const s = d.summary || {};
  let snap = "";
  if (s.strategy === "prereq_graph") {
    snap = `<table><tr><th>Skill</th><th>Level</th><th>Mastery</th></tr>${Object.entries(s.mastery).map(([k, v]) => `
      <tr><td>${esc(setTitle(k))}</td><td class="muted">${esc(setLevel(k))}</td>
      <td><span class="bar"><span style="width:${Math.round(v * 100)}%;background:${v >= s.threshold ? "var(--ok)" : "var(--accent)"}"></span></span> ${Math.round(v * 100)}%</td></tr>`).join("")}</table>`;
  } else if (s.strategy === "spaced_repetition") {
    snap = `<table><tr><th>Word</th><th>Box</th><th>Reviews</th><th>Lapses</th></tr>${Object.entries(s.cards).map(([k, c]) => `
      <tr><td>${esc(setTitle(k))}</td><td>${c.box}</td><td>${c.reviews}</td><td>${c.lapses ? `<span class="badge ${c.lapses >= 3 ? "bad" : "warn"}">${c.lapses}</span>` : 0}</td></tr>`).join("")}</table>
      <p class="small muted">Not started: ${s.not_started.map(setTitle).join(", ") || "—"}</p>`;
  } else if (s.strategy === "level_descent") {
    snap = `<div class="kv"><div class="muted">Completed units</div><div>${s.completed_units.join(", ") || "—"}</div>
      <div class="muted">Current position</div><div>${s.position.length ? s.position.map(f => `${esc(f.set)} <span class="muted">(${esc(f.level)})</span>`).join(" → ") : "between sets"}</div></div>`;
  }

  // merge attempts + events into one path
  const items = [];
  d.attempts.forEach(a => items.push({ ts: a.ts, cls: a.passed ? "pass" : "fail",
    html: `${a.passed ? "✓" : "✗"} <b>${esc(setTitle(a.set_id))}</b> <span class="muted">${esc(setLevel(a.set_id))} · ${esc(a.item_type)} · score ${a.score}</span>
           ${a.item_type === "code_python" || a.item_type === "free_text" ? `<details><summary class="small muted">answer</summary><pre class="resp">${esc(a.response)}</pre></details>` : `<span class="mono muted"> “${esc(a.response.slice(0, 60))}”</span>`}` }));
  const EV = {
    activity: e => ({ cls: "teach", html: `📖 Lesson shown: ${esc((pack.activities[e.activity_id] || {}).title || e.activity_id)}${e.reason ? ` <span class="muted">— ${esc(e.reason)}</span>` : ""}` }),
    descend: e => ({ cls: "teach", html: `↓ Descend from <b>${esc(e.from_set)}</b> to ${e.to_sets.map(esc).join(", ")} <span class="muted">(${esc(e.level)})</span>` }),
    ascend: e => ({ cls: "teach", html: `↑ Back up to <b>${esc(e.to_set)}</b> (different item)` }),
    restudy: e => ({ cls: "teach", html: `↺ Re-study at lowest level: ${esc(setTitle(e.set_id))}` }),
    diagnose: e => ({ cls: "teach", html: `🔍 Diagnosing <b>${esc(setTitle(e.set_id))}</b> — probing ${e.probing.map(setTitle).map(esc).join(", ")}` }),
    gap_found: e => ({ cls: "fail", html: `⚠ Gap found: <b>${esc(setTitle(e.set_id))}</b>` }),
    probe_pass: e => ({ cls: "pass", html: `Prerequisite OK: ${esc(setTitle(e.set_id))}` }),
    mastered: e => ({ cls: "pass", html: `★ Mastered <b>${esc(setTitle(e.set_id))}</b>` }),
    return: e => ({ cls: "teach", html: `↩ Return to ${esc(setTitle(e.set_id))}` }),
    reteach: e => ({ cls: "teach", html: `↺ Re-teach ${esc(setTitle(e.set_id))}` }),
    goal_start: e => ({ cls: "", html: `Goal: <b>${esc(setTitle(e.set_id))}</b>` }),
    unit_start: e => ({ cls: "", html: `Unit started: <b>${esc(e.unit)}</b>` }),
    unit_complete: e => ({ cls: "pass", html: `Unit complete: <b>${esc(e.unit)}</b>` }),
    new_card: e => ({ cls: "teach", html: `New word: <b>${esc(setTitle(e.set_id))}</b>` }),
    promote: e => ({ cls: "pass", html: `${esc(setTitle(e.set_id))} → box ${e.box}` }),
    lapse: e => ({ cls: "fail", html: `${esc(setTitle(e.set_id))} lapsed (lapses: ${e.lapses})` }),
    clock_advanced: e => ({ cls: "", html: `⏩ Clock advanced ${e.days} day(s)` }),
    teacher_alert: e => ({ cls: "alert", html: `🔔 Teacher alerted: ${esc(e.message)}` }),
    misconception: e => ({ cls: "fail", html: `🤔 Misconception <b>${esc(misLabel(e.set_id, e.misconception))}</b> — answered “${esc(e.response)}”` }),
    followup: e => ({ cls: "teach", html: `💬 Follow-up asked: <i>${esc(e.question)}</i>` }),
    session_start: e => ({ cls: "", html: `Session started (${esc(STRATEGY_LABEL[e.strategy] || e.strategy)})` }),
  };
  d.events.forEach(e => { const f = EV[e.kind]; if (f) items.push({ ts: e.ts, ...f(e.payload) }); });
  const PH = { elicit: "Prior knowledge", predict: "Prediction", explore: "Investigation", probe: "Reasoning" };
  (d.responses || []).forEach(r => items.push({ ts: r.ts, cls: "teach",
    html: `✎ <b>${PH[r.phase] || r.phase}</b>${r.is_followup ? " (follow-up)" : ""} <span class="muted">· ${esc(setTitle(r.set_id))}</span>
      <div class="small muted">${mdi(r.prompt)}</div><pre class="resp">${esc(r.response)}</pre>` }));
  const thinking = (d.responses || []).filter(r => ["predict", "probe", "explore"].includes(r.phase));
  items.sort((a, b) => a.ts - b.ts);

  view.innerHTML = `
    <button class="link" id="back">← All students</button>
    <div class="panel" style="margin:10px 0 16px">
      <h2 style="margin-top:0">${esc(student)} · ${esc(pack.title)}</h2>
      <p class="muted small" style="margin-top:-8px">${STRATEGY_LABEL[pack.strategy]}</p>${snap}
    </div>
    ${thinking.length ? `<div class="panel" style="margin-bottom:16px"><h3 style="margin-top:0">Student thinking</h3>
      <table class="thinking"><tr><th>Skill</th><th>Step</th><th>Question</th><th>Student wrote</th></tr>
      ${thinking.map(r => `<tr><td>${esc(setTitle(r.set_id))}</td><td><span class="badge grey">${PH[r.phase]}</span></td>
        <td class="small">${mdi(r.prompt)}</td><td>${esc(r.response)}</td></tr>`).join("")}</table></div>` : ""}
    <div class="panel"><h3 style="margin-top:0">Learning path</h3>
      <ul class="timeline">${items.map(i => `<li class="${i.cls}">${i.html}</li>`).join("")}</ul></div>`;
  document.getElementById("back").onclick = students;
}

// ---------------------------------------------------------------- packs
async function packsTab() {
  view.innerHTML = `
    <div class="panel" style="margin-bottom:16px">
      <div class="row"><b>Add a subject with AI</b><span style="margin-left:auto"></span><button id="reload">Reload pack files</button></div>
      <p class="small muted" style="margin-bottom:6px">Generate a draft pack from a short brief (needs <code>ANTHROPIC_API_KEY</code>), then click “Reload”, review it here and approve:</p>
      <pre class="resp">python -m tutor.authoring generate --strategy prereq_graph --title "Decimals" \\
    --subject "Mathematics (Class 6)" --brief "place value, comparing, adding decimals" \\
    --out packs/math_decimals.json</pre>
    </div>
    ${packs.map(p => `
      <div class="panel" style="margin-bottom:12px">
        <div class="row"><b>${esc(p.title)}</b><span class="badge grey">${STRATEGY_LABEL[p.strategy] || p.strategy}</span>
          <span class="badge grey">${p.pedagogy === "inquiry" ? "Inquiry" : "Direct"}</span>
          <span class="badge ${p.status === "approved" ? "ok" : "warn"}">${p.status}</span>
          <span class="muted small">${p.sets} sets · ${p.items} items</span><span style="margin-left:auto"></span>
          <button class="link" data-view="${p.id}">Review content</button>
          <button data-approve="${p.id}" data-to="${p.status !== "approved"}">${p.status === "approved" ? "Unpublish" : "Approve"}</button></div>
        <div id="pv-${p.id}"></div>
      </div>`).join("")}`;
  document.getElementById("reload").onclick = async () => { await api.post("/api/packs/reload"); show("packs"); };
  view.querySelectorAll("[data-approve]").forEach(b => b.onclick = async () => {
    try { await api.post(`/api/packs/${b.dataset.approve}/approve`, { approved: b.dataset.to === "true" }); show("packs"); }
    catch (e) { alert("Cannot approve: " + e.message); }
  });
  view.querySelectorAll("[data-view]").forEach(b => b.onclick = () => reviewPack(b.dataset.view));
}

async function reviewPack(id) {
  const box = document.getElementById("pv-" + id);
  if (box.innerHTML) { box.innerHTML = ""; return; }
  const [pack, v] = await Promise.all([api.get(`/api/packs/${id}`), api.get(`/api/packs/${id}/validate`)]);
  const val = `<div style="margin:12px 0">${v.errors.length ? `<span class="badge bad">${v.errors.length} errors</span>` : `<span class="badge ok">valid</span>`}
    ${v.warnings.length ? `<span class="badge warn">${v.warnings.length} warnings</span>` : ""}
    ${[...v.errors, ...v.warnings].map(m => `<div class="small">• ${esc(m)}</div>`).join("")}</div>`;
  const units = pack.units.map(u => `<div class="small"><b>${esc(u.title || u.id)}</b>: ${u.sets.map(esc).join(" → ")}</div>`).join("");
  const sets = Object.entries(pack.item_sets).map(([sid, s]) => `
    <div class="set-block">
      <div class="row"><b>${esc(sid)}</b> ${esc(s.title || "")} ${s.level ? `<span class="badge grey">${esc(s.level)}</span>` : ""}</div>
      ${(s.links || []).length ? `<div class="small muted">${pack.strategy === "prereq_graph" ? "Prerequisites" : "If failed → "}: ${s.links.map(esc).join(", ")}</div>` : ""}
      ${s.episode ? `<details><summary class="small">Inquiry episode</summary><div class="small" style="margin:6px 0 6px 12px">
        ${(s.episode.elicit || []).map(e => `<div><b>Think back:</b> ${mdi(e.prompt)}</div>`).join("")}
        ${s.episode.predict ? `<div><b>Predict:</b> ${mdi(s.episode.predict.prompt)}</div>` : ""}
        ${s.episode.explore ? `<div><b>Investigate (${esc(s.episode.explore.tool)}):</b> ${mdi(s.episode.explore.prompt || "")}</div>` : ""}
        ${(s.episode.probe || []).map(p => `<div><b>Probe (${esc(p.kind)}):</b> ${mdi(p.prompt)}</div>`).join("")}
        ${(s.episode.connect || []).map(c => `<div><b>Where else:</b> ${mdi(c)}</div>`).join("")}
        ${s.episode.key_learning ? `<div><b>Key learning:</b> ${esc(s.episode.key_learning)}</div>` : ""}</div></details>` : ""}
      <details><summary class="small">${s.items.length} items</summary>
        ${s.items.map(it => `<div class="small" style="margin:8px 0 8px 12px"><span class="badge grey">${esc(it.type)}</span>
          <div class="md">${md(it.prompt)}</div>
          ${it.options ? `<div class="muted">Options: ${it.options.map(esc).join(" | ")}</div>` : ""}
          ${it.answer !== undefined ? `<div>Answer: <b>${esc(it.answer)}</b></div>` : ""}
          ${it.rubric ? `<div>Rubric: ${esc(it.rubric)}</div>` : ""}
          ${(it.hints || []).map((h, i) => `<div class="muted">Hint ${i + 1}: ${mdi(h)}</div>`).join("")}
          ${(it.misconceptions || []).map(m => `<div style="color:#5b37a0">If “${esc((m.values || m.responses || [m.pattern]).join(" / "))}” (${esc(m.label || m.id)}): ${mdi(m.probe)}</div>`).join("")}
          ${it.tests ? `<pre class="resp">${it.tests.map(esc).join("\n")}</pre>` : ""}</div>`).join("")}
      </details>
    </div>`).join("");
  box.innerHTML = val + `<div style="margin-bottom:10px">${units}</div>` + sets;
}

// ---------------------------------------------------------------- Science Buddy
const SKILLS = [["observing", "Observing"], ["classifying", "Classifying"], ["measuring", "Measuring"], ["communicating", "Communicating"],
  ["inferring", "Inferring"], ["predicting", "Predicting"], ["questioning", "Questioning"], ["controlling_variables", "Controlling variables"],
  ["hypothesising", "Hypothesising"], ["defining_operationally", "Defining operationally"], ["experimenting", "Experimenting"],
  ["interpreting_data", "Interpreting data"]];
const LV = { emerging: ["E", "warn", "Emerging"], developing: ["D", "", "Developing"], independent: ["I", "ok", "Independent"] };
const chip = l => l ? `<span class="badge ${LV[l][1]}" title="${LV[l][2]}">${LV[l][0]}</span>` : `<span class="muted">—</span>`;

async function buddyTab() {
  const rows = await api.get("/api/teacher/buddy");
  if (!rows.length) { view.innerHTML = `<div class="panel empty">No learners have used the Science Buddy yet.</div>`; return; }
  view.innerHTML = `<div class="panel" style="overflow-x:auto"><p class="small muted" style="margin-top:0">E = Emerging · D = Developing · I = Independent · — = no evidence yet. Basic skills first, then integrated.</p>
    <table><tr><th>Learner</th><th>Class</th>${SKILLS.map(([, n]) => `<th style="writing-mode:vertical-rl;transform:rotate(180deg);height:120px">${n}</th>`).join("")}<th>Inquiries</th></tr>
    ${rows.map(r => `<tr class="click" data-s="${esc(r.student)}"><td><b>${esc(r.student)}</b></td><td>${r.grade || "—"}</td>
      ${SKILLS.map(([k]) => `<td>${chip(r.levels[k])}</td>`).join("")}<td>${r.inquiries}</td></tr>`).join("")}</table></div>`;
  view.querySelectorAll("tr.click").forEach(tr => tr.onclick = () => buddyDetail(tr.dataset.s));
}

async function buddyDetail(student) {
  document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("active", b.dataset.tab === "buddy"));
  const d = await api.get(`/api/teacher/buddy/${encodeURIComponent(student)}`);
  const p = d.profile;
  const name = Object.fromEntries(SKILLS);
  const skillRows = SKILLS.map(([k, n]) => {
    const s = p.skills[k];
    return `<tr><td><b>${n}</b></td><td>${s.assessed ? chip(s.level) + " " + LV[s.level][2] : chip(null)}</td>
      <td class="small">${s.evidence.map(e => `“${esc(e.quote)}” <span class="muted">(${e.signal})</span>`).join("<br>") || ""}</td>
      <td class="small">${s.history.map(h => `${LV[h.from][2]} → <b>${LV[h.to][2]}</b>: ${esc(h.reason)} <span class="muted">· session ${h.session} · ${ago(h.ts)}</span>`).join("<br>")}</td></tr>`;
  }).join("");
  const inq = p.inquiries.slice().reverse().map(i => `<div class="set-block">
      <div class="row"><b>${esc(i.title || "Untitled inquiry")}</b><span class="badge ${i.status === "done" ? "ok" : "grey"}">${i.status}</span><span class="badge grey">stage: ${esc(i.stage)}</span></div>
      ${i.question ? `<div class="small">Question: ${esc(i.question)}</div>` : ""}
      ${i.task ? `<div class="small">Task: ${esc(i.task)}</div>` : ""}
      ${(i.chapters || []).length ? `<div class="small muted">Syllabus: ${i.chapters.map(c => esc(d.chapters[c] || c)).join("; ")}</div>` : ""}
      ${i.self_assessment ? `<div class="small">Self-assessment — easiest: ${esc(i.self_assessment.easiest || "—")}; hardest: ${esc(i.self_assessment.hardest || "—")}</div>` : ""}</div>`).join("");
  const sess = d.sessions.map(s => `<details style="margin:8px 0"><summary>Session ${s.id} · ${new Date(s.started * 1000).toLocaleString()} · focus: <b>${esc(name[s.focus] || s.focus)}</b>${s.closed ? "" : " · (open)"}</summary>
      <div style="margin:8px 0 0 10px">${s.turns.filter(t => t.role !== "event").map(t => `<div class="small" style="margin:6px 0">
        <b>${t.role === "tutor" ? "Buddy" : esc(student)}:</b> ${esc(t.text)}
        ${t.role === "tutor" && t.meta.ladder_step ? `<span class="badge grey">ladder step ${t.meta.ladder_step}</span>` : ""}
        ${t.meta.skill_named ? `<span class="badge ok">named: ${esc(t.meta.skill_named)}</span>` : ""}
        ${t.meta.regenerated ? `<span class="badge bad" title="The first draft was blocked">blocked draft: ${esc(t.meta.regenerated)}</span>` : ""}
        ${t.meta.wellbeing_match ? `<span class="badge bad">wellbeing flag</span>` : ""}</div>`).join("")}</div></details>`).join("");
  view.innerHTML = `<button class="link" id="back">← All learners</button>
    <div class="panel" style="margin:10px 0 16px"><h2 style="margin-top:0">${esc(student)} · Science Buddy</h2>
      <p class="small muted" style="margin-top:-8px">Class ${p.grade || "?"} · consent: ${p.consent ? `${esc(p.consent.by)} (${esc(p.consent.relation)}), ${new Date(p.consent.ts * 1000).toLocaleDateString()} — ${esc(p.consent.method)}` : "none"}</p>
      <table><tr><th>Skill</th><th>Level</th><th>Last two pieces of evidence</th><th>Level changes (with reasons)</th></tr>${skillRows}</table></div>
    <div class="panel" style="margin-bottom:16px"><h3 style="margin-top:0">Inquiries</h3>${inq || `<p class="muted small">None yet.</p>`}
      ${p.achievements.length ? `<h4>What the learner was told they can now do</h4><ul>${p.achievements.map(a => `<li class="small">${esc(a.text)}</li>`).join("")}</ul>` : ""}</div>
    <div class="panel"><h3 style="margin-top:0">Conversations</h3>${sess || `<p class="muted small">None yet.</p>`}</div>`;
  document.getElementById("back").onclick = buddyTab;
}

show("alerts");
</script>
</body>
</html>
