<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tutor</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="top">
  <h1>Tutor</h1>
  <span class="muted small" id="who"></span>
  <nav><a href="#" id="nav-home">Subjects</a><a href="/teacher">Teacher dashboard →</a></nav>
</header>
<main id="app"></main>

<script src="/static/common.js"></script>
<script src="/static/tools.js"></script>
<script>
const app = document.getElementById("app");
let student = localStorage.getItem("tutor_student") || "";
let packId = null, packs = [];
let feedbackShown = null;   // last graded result, shown above the next action

document.getElementById("nav-home").onclick = e => { e.preventDefault(); home(); };

function setWho() {
  document.getElementById("who").textContent = student ? `Signed in as ${student}` : "";
}

async function home() {
  packId = null; feedbackShown = null; setWho();
  packs = (await api.get("/api/packs")).filter(p => p.status === "approved");
  app.innerHTML = `
    <div class="panel" style="margin-bottom:20px">
      <label class="small muted">Your first name or nickname</label>
      <div class="row" style="margin-top:6px">
        <input type="text" id="name" placeholder="e.g. Asha" value="${esc(student)}" style="max-width:320px">
      </div>
    </div>
    <h2 style="font-size:18px">Choose a subject</h2>
    <div class="grid">
      <div class="panel pack-card" data-buddy="1" style="border-color:#c9b8ec;background:#faf7ff">
        <span class="muted small">Science · Classes 6–8</span>
        <h3>🔍 Science Buddy</h3>
        <div class="row" style="gap:6px"><span class="badge" style="background:#efe7fd;color:#5b37a0">Open inquiry</span><span class="badge ok">Text or voice</span></div>
        <p class="small muted" style="margin:6px 0 0">Tell the Buddy something you noticed today. It helps you investigate it with things at home — by asking, not telling.</p>
      </div>${packs.map(p => `
      <div class="panel pack-card" data-id="${p.id}">
        <span class="muted small">${esc(p.subject)}</span>
        <h3>${esc(p.title)}</h3>
        <div class="row" style="gap:6px"><span class="badge">${STRATEGY_LABEL[p.strategy] || p.strategy}</span>
          ${p.pedagogy === "inquiry" ? `<span class="badge ok">Inquiry-based</span>` : ""}</div>
        <p class="small muted" style="margin:6px 0 0">${esc(p.description)}</p>
      </div>`).join("")}
    </div>`;
  app.querySelectorAll(".pack-card").forEach(el => el.onclick = () => {
    const n = document.getElementById("name").value.trim();
    if (!n) { document.getElementById("name").focus(); return; }
    student = n; localStorage.setItem("tutor_student", n); setWho();
    if (el.dataset.buddy) { location.href = "/buddy"; return; }
    start(el.dataset.id);
  });
}

async function start(id) {
  packId = id; feedbackShown = null;
  render(await api.get(`/api/session/${encodeURIComponent(student)}/${id}`));
}

const base = () => `/api/session/${encodeURIComponent(student)}/${packId}`;

function progressHtml(p) {
  const pack = packs.find(x => x.id === packId) || {};
  if (!p) return "";
  const bits = [`<span><b>${esc(pack.title || "")}</b></span>`];
  if (pack.strategy === "level_descent") {
    bits.push(`<span>Unit ${p.unit_index > p.unit_count ? p.unit_count : p.unit_index}/${p.unit_count}: ${esc(p.unit)}</span>`);
    bits.push(`<span>Question set ${p.step}/${p.step_count}</span>`);
    if (p.remediation_depth) bits.push(`<span class="badge warn">reviewing ${p.remediation_depth} level${p.remediation_depth > 1 ? "s" : ""} down</span>`);
  } else if (pack.strategy === "prereq_graph") {
    bits.push(`<span>Skill ${p.goal_index}/${p.goal_count}${p.skill ? ": " + esc(p.skill) : ""}</span>`);
    if (p.mastery != null) bits.push(`<span>Mastery <span class="bar"><span style="width:${Math.round(p.mastery * 100)}%"></span></span> ${Math.round(p.mastery * 100)}%</span>`);
    if (p.remediation_depth) bits.push(`<span class="badge warn">fixing a building block</span>`);
  } else if (pack.strategy === "spaced_repetition") {
    bits.push(`<span>Words started ${p.learning}/${p.total}</span><span>Well known ${p.mature}</span>`);
    if (p.due_again_soon) bits.push(`<span class="badge warn">${p.due_again_soon} coming back soon</span>`);
  }
  return `<div class="progress">${bits.join("")}</div>`;
}

function feedbackHtml(r) {
  if (!r) return "";
  if (r.recorded) return r.ack ? `<div class="ack">✓ ${esc(r.ack)}</div>` : "";
  if (r.retry) {
    const p = r.probe || {};
    const head = p.kind === "misconception" ? "🤔 Not yet — think about this" :
      `💡 Not yet — hint ${p.rung} of ${p.of}`;
    return `<div class="probe-box"><h4>${head}</h4>${r.feedback ? `<div class="line">${mdi(r.feedback)}</div>` : ""}
      <div class="line">${mdi(p.text)}</div><div class="small muted" style="margin-top:6px">Have another go at the same question.</div></div>`;
  }
  const lines = [];
  if (r.feedback) lines.push(`<div class="line">${mdi(r.feedback)}</div>`);
  if (r.hint) lines.push(`<div class="line"><b>Hint:</b> ${mdi(r.hint)}</div>`);
  if (r.answer !== undefined) lines.push(`<div class="line"><b>Answer:</b> ${esc(r.answer)}</div>`);
  if (r.explanation) lines.push(`<div class="line"><b>${r.passed ? "Why" : "Worked example"}:</b> ${mdi(r.explanation)}</div>`);
  const head = r.passed ? (r.assisted ? "✓ You got there!" : "✓ Correct") : "✗ Not quite";
  return `<div class="feedback ${r.passed ? "ok" : "bad"}"><h4>${head}</h4>${lines.join("")}</div>`;
}

const PHASE_LABEL = { elicit: "Think back", predict: "Predict", probe: "Think about it", explore: "Investigate" };

function render(a) {
  const prog = progressHtml(a.progress);
  const fbHtml = feedbackShown ? feedbackHtml(feedbackShown) : "";
  const fb = fbHtml ? fbHtml + `<div style="height:14px"></div>` : "";
  feedbackShown = null;
  let body = "";
  let tool = null;
  const cont = `<div class="actions"><button class="primary" id="go">Continue</button></div>`;
  if (a.type === "activity") {
    body = `<div class="panel">${fb}<div class="card-kind">Lesson</div>
      ${a.reason ? `<div class="reason">${esc(a.reason)}</div>` : ""}
      <h2 style="margin-top:0">${esc(a.title)}</h2><div class="md">${md(a.body)}</div>${cont}</div>`;
  } else if (a.type === "message") {
    body = `<div class="panel message ${a.tone}">${fb}<div class="md">${md(a.text)}</div>${cont}</div>`;
  } else if (a.type === "prompt") {
    const label = a.is_followup ? "One more question" : (PHASE_LABEL[a.phase] || "Think");
    const opts = a.options ? `<div class="options">${a.options.map(o =>
      `<label class="option" data-v="${esc(o)}"><input type="radio" name="opt"><span class="md">${md(o)}</span></label>`).join("")}</div>
      <div class="small muted" style="margin:12px 0 6px">Why do you think so?</div>` : "";
    body = `<div class="panel phase-${a.phase}">${fb}<div class="card-kind">${label}</div>
      <div class="prompt md">${md(a.prompt)}</div>${opts}
      <textarea id="ans" rows="3" placeholder="${a.phase === "predict" ? "My guess is… because…" : "Write what you think…"}"></textarea>
      ${a.phase === "predict" ? `<div class="small muted" style="margin-top:6px">There's no wrong answer here — just make your best guess.</div>` : ""}
      <div class="actions"><button class="primary" id="send">Share</button><span class="muted small" id="status"></span></div></div>`;
  } else if (a.type === "explore") {
    body = `<div class="panel phase-explore">${fb}<div class="card-kind">${a.again ? "Investigate again" : "Investigate"}</div>
      <div class="prompt md">${md(a.prompt || "")}</div><div class="tool" id="tool"></div>
      <div class="small" style="margin:10px 0 6px"><b>${mdi(a.record || "What did you find?")}</b></div>
      <textarea id="ans" rows="3" placeholder="I noticed…"></textarea>
      <div class="actions"><button class="primary" id="send">Share what I found</button><span class="muted small" id="status"></span></div></div>`;
  } else if (a.type === "explain") {
    body = `<div class="panel">${fb}<div class="card-kind">Let's make sense of it</div>
      ${a.revisit ? `<div class="revisit md">${md(a.revisit)}</div>` : ""}
      <h2 style="margin-top:0">${esc(a.title)}</h2><div class="md">${md(a.body)}</div>${cont}</div>`;
  } else if (a.type === "connect") {
    body = `<div class="panel">${fb}<div class="card-kind">Where else?</div>
      ${a.items.length ? `<ul>${a.items.map(i => `<li>${mdi(i)}</li>`).join("")}</ul>` : ""}
      ${a.key_learning ? `<div class="key-learning">🔑 ${esc(a.key_learning)}</div>` : ""}${cont}</div>`;
  } else if (a.type === "item") {
    body = `<div class="panel">${fb}<div class="card-kind">Question</div>
      <div class="prompt md">${md(a.prompt)}</div>${inputHtml(a)}
      <div class="actions"><button class="primary" id="submit">Check answer</button><span class="muted small" id="status"></span></div></div>`;
  } else if (a.type === "done") {
    body = `<div class="panel">${fb}<h2>🎉 ${esc(a.text)}</h2>
      <div class="actions"><button id="back">Back to subjects</button>
      ${a.resumable ? `<button id="skip" title="Prototype helper: pretend a day has passed">⏩ Skip ahead 1 day (demo)</button>` : ""}
      <button class="link" id="reset">Start this subject over</button></div></div>`;
  }
  app.innerHTML = prog + body;
  if (a.type === "explore") {
    const t = TOOLS[a.tool];
    tool = t ? t(document.getElementById("tool"), a) : null;
  }
  wire(a, tool);
  window.scrollTo(0, 0);
}

function inputHtml(a) {
  if (a.item_type === "mcq") {
    return `<div class="options">${a.options.map((o, i) =>
      `<label class="option" data-v="${esc(o)}"><input type="radio" name="opt" value="${i}"><span class="md">${md(o)}</span></label>`).join("")}</div>`;
  }
  if (a.item_type === "code_python") return `<textarea class="code" id="ans" spellcheck="false">${esc(a.starter || "")}</textarea>`;
  if (a.item_type === "free_text") return `<textarea id="ans" rows="4" placeholder="Write your answer…"></textarea>`;
  const ph = { fraction: "e.g. 3/4", numeric: "a number", text: "type your answer" }[a.item_type] || "";
  return `<input type="text" id="ans" autocomplete="off" placeholder="${ph}">`;
}

function wire(a, tool) {
  const go = document.getElementById("go");
  if (go) { go.onclick = async () => { go.disabled = true; render(await api.post(base() + "/continue")); }; go.focus(); }
  const back = document.getElementById("back");
  if (back) back.onclick = home;
  const skip = document.getElementById("skip");
  if (skip) skip.onclick = async () => render(await api.post(base() + "/advance", { days: 1 }));
  const reset = document.getElementById("reset");
  if (reset) reset.onclick = async () => { if (confirm("Erase your progress in this subject?")) { await api.post(base() + "/reset"); start(packId); } };

  let selected = null;
  app.querySelectorAll(".option").forEach(el => el.onclick = () => {
    app.querySelectorAll(".option").forEach(x => x.classList.remove("sel"));
    el.classList.add("sel"); el.querySelector("input").checked = true; selected = el.dataset.v;
  });
  const ans = document.getElementById("ans");
  const status = document.getElementById("status");

  // ungraded episode responses
  const send = document.getElementById("send");
  if (send) {
    send.onclick = async () => {
      let text = ans.value.trim();
      if (a.options) {
        if (!selected) { status.textContent = "Pick one first."; return; }
        text = selected + (text ? " — because " + text : "");
      }
      const extra = tool && tool.summary ? tool.summary() : "";
      if (!text && !extra) { status.textContent = "Write something first — any idea is fine."; return; }
      if (extra) text += (text ? "\n" : "") + "[" + extra + "]";
      send.disabled = true;
      const r = await api.post(base() + "/answer", { response: text });
      feedbackShown = r.result;
      render(r.action);
    };
    return;
  }

  if (a.type !== "item") return;
  if (ans) {
    ans.focus();
    if (ans.tagName === "INPUT") ans.onkeydown = e => { if (e.key === "Enter") submit.click(); };
    if (ans.classList.contains("code")) ans.onkeydown = e => {
      if (e.key === "Tab") { e.preventDefault(); const s = ans.selectionStart; ans.setRangeText("    ", s, ans.selectionEnd, "end"); }
    };
  }
  const submit = document.getElementById("submit");
  submit.onclick = async () => {
    const response = a.item_type === "mcq" ? selected : ans.value;
    if (response == null || String(response).trim() === "") { status.textContent = "Please answer first."; return; }
    submit.disabled = true;
    status.textContent = a.item_type === "code_python" ? "Running your code…" : "Checking…";
    const r = await api.post(base() + "/answer", { response });
    feedbackShown = r.result;
    render(r.action);
  };
}

home();
</script>
</body>
</html>
